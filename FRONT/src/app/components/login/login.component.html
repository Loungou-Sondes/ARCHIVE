<p-toast position="top-center" styleClass="login-toast" [baseZIndex]="20000" />
<div class="animation-area login-page-scroll flex flex-column align-items-center min-w-screen">
  <ul class="box-area">
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
  </ul>

  <app-lang-select variant="login" />

  <div class="grid justify-content-center login-content-grid p-3 lg:p-0">
    <div class="scalein animation-duration-500 col-12 mt-5 xl:mt-0 text-center">
      <img src="assets/images/Logo.png" alt="Office de la Marine Marchande et des Ports" class="logo-img">
    </div>

    <div class="fadein animation-duration-200 col-12 login-panel-col login-panel-shell">
      <div class="login-card">
        <div class="text-center mb-4">
          <div class="welcome-title">
            <span class="office-name">{{ 'login.officeName' | transloco }}</span>
            <span class="welcome-message">{{ 'login.welcome' | transloco }}</span>
          </div>
          <span class="welcome-subtitle">{{ 'login.subtitle' | transloco }}</span>
        </div>

        <div class="w-full mx-auto login-form-inner">
          <div class="field-wrapper">
            <label for="username" class="field-label">
              <i class="pi pi-user mr-2"></i>
              {{ 'login.username' | transloco }}
            </label>
            <div class="p-inputgroup custom-input-group">
              <span class="p-inputgroup-addon"><i class="pi pi-user"></i></span>
              <input id="username" [(ngModel)]="username" (keyup.enter)="onSubmit()" type="text"
                [placeholder]="'login.usernamePlaceholder' | transloco" pInputText class="custom-input" autocomplete="username">
            </div>
          </div>

          <div class="field-wrapper">
            <label for="password" class="field-label">
              <i class="pi pi-key mr-2"></i>
              {{ 'login.password' | transloco }}
            </label>
            <div class="p-inputgroup custom-input-group password-input-group">
              <span class="p-inputgroup-addon"><i class="pi pi-key"></i></span>
              <input
                id="password"
                [type]="passwordVisible ? 'text' : 'password'"
                [(ngModel)]="password"
                (keyup.enter)="onSubmit()"
                [placeholder]="'login.passwordPlaceholder' | transloco"
                pInputText
                class="custom-input password-field-input"
                autocomplete="current-password" />
              <button
                type="button"
                class="password-toggle-btn"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="passwordVisible ? ('login.hidePassword' | transloco) : ('login.showPassword' | transloco)"
                [attr.aria-pressed]="passwordVisible">
                <i [class]="passwordVisible ? 'pi pi-eye' : 'pi pi-eye-slash'" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="login-links-row mb-4">
            <a class="forgot-password-link" (click)="resetPassword()">
              <i class="pi pi-question-circle mr-1"></i>
              {{ 'login.forgotPassword' | transloco }}
            </a>
          </div>

          <button
            pButton
            pRipple
            [label]="'login.submit' | transloco"
            (click)="onSubmit()"
            icon="pi pi-sign-in"
            iconPos="right"
            class="login-button"
            [disabled]="submitting">
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
